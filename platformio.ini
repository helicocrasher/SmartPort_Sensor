; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
;default_envs = g431cb
;default_envs = g031f8
default_envs = seeed_xiao_esp32s3
;default_envs = ws_esp32s3_zero
;default_envs = esp32-c3-supermini

[env:g031f8]
platform = ststm32@19.4.0
board = genericSTM32G031F8
platform_packages = 
	framework-arduinoststm32@https://github.com/stm32duino/Arduino_Core_STM32.git
framework = arduino
build_flags = -DTARGET_G031F8
lib_deps = 
	helicocrasher/SmartPortSlave@^0.2.0
	sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.28
	iitaka1142/NullSerial@^0.1.0

[env:g431cb]
platform = ststm32@19.4.0
board = genericSTM32G431CB
platform_packages = 
	framework-arduinoststm32@https://github.com/stm32duino/Arduino_Core_STM32.git
framework = arduino
monitor_port = COM10
build_flags = 
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D USBCON
	-D USBD_VID=0x0483
	-D USBD_PID=0x0003
	-D USB_MANUFACTURER="Unknown"
	-D USB_PRODUCT="\"STM32G431CB\""
	-D HAL_PCD_MODULE_ENABLED
	-DTARGET_G431CB
lib_deps = 
	helicocrasher/SmartPortSlave@^0.2.0
	sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.28
	iitaka1142/NullSerial@^0.1.0

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_port = COM25
monitor_port = COM25
monitor_speed = 115200
lib_deps = 
	helicocrasher/SmartPortSlave@^0.2.0
	sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.28
	iitaka1142/NullSerial@^0.1.0
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DTARGET_ESP32C3_SUPERMINI

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
upload_port = COM12
monitor_port = COM12
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DTARGET_SEEED_XIAO_ESP32S3
lib_deps = 
	helicocrasher/SmartPortSlave@^0.2.0
	sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.28
	iitaka1142/NullSerial@^0.1.0

[env:ws_esp32s3_zero]
platform = espressif32
board = lolin_s3_mini
framework = arduino
upload_port = COM24
monitor_port = COM24
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DTARGET_WS_ESP32S3_ZERO
lib_deps = 
	helicocrasher/SmartPortSlave@^0.2.0	
	sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.28
	iitaka1142/NullSerial@^0.1.0

