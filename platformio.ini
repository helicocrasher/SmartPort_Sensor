; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
;default_envs = g031f8
default_envs = g431cb

[env:g031f8]
platform = ststm32@19.4.0
board = genericSTM32G031F8
platform_packages = 
	framework-arduinoststm32@https://github.com/stm32duino/Arduino_Core_STM32.git
framework = arduino
build_flags = -DTARGET_G031F8
;lib_deps = adafruit/Adafruit INA3221 Library@^1.0.1

[env:g431cb]
platform = ststm32@19.4.0
board = genericSTM32G431CB
platform_packages = 
	framework-arduinoststm32@https://github.com/stm32duino/Arduino_Core_STM32.git
framework = arduino
build_flags = 
		-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-D USBCON
	-D USBD_VID=0x0483
	-D USBD_PID=0x0003
	-D USB_MANUFACTURER="Unknown"
	-D USB_PRODUCT="\"STM32G431CB\""
	-D HAL_PCD_MODULE_ENABLED
	-DTARGET_G431CB
;lib_deps = 	adafruit/Adafruit INA3221 Library@^1.0.1
